services:
  cloudflare_ip:
    image: ghcr.io/lsaobo17/cloudflare_ip:latest
    container_name: cloudflare_ip
    restart: unless-stopped
    # Linux / NAS 环境推荐开启 host 网络直连，避免 NAT 虚拟网卡测速偏差
    network_mode: "host"
    environment:
      - TZ=Asia/Shanghai
      # 定时任务 CRON 表达式（每天凌晨两点 02:00 整点运行）
      - CRON_SCHEDULE=0 2 * * *
      # 容器启动时是否立即触发一次测速
      - RUN_ON_START=true
      # 是否仅单次执行（设为 true 测速完成后自动退出；设为 false 常驻定时运行）
      - RUN_ONCE=false

      # --- 运行模式与功能开关（直接在此配置，无需创建 .env 文件） ---
      - DEFAULT_MODE=cloud
      - USE_R2=true
      - USE_GH=false
      - USE_TG=false
      - USE_MAIL=false

      # --- Cloudflare R2 参数（直接替换为你自己的密钥） ---
      - CF_ACCOUNT_ID=你的账户ID
      - CF_ACCESS_KEY=你的访问密钥ID
      - CF_SECRET_KEY=你的机密访问密钥
      - CF_BUCKET_NAME=你的存储桶名称

    # 💡 提示：使用 R2 上传时，测速文件会自动同步至云端，以下 volumes 可直接不挂载（避免 NAS 将单文件误创建为文件夹报错）。
    # 若确实需要在宿主机本地查看测速文件，请先在宿主机终端执行：touch best_ips.txt full_ips.txt 再取消以下注释：
    # volumes:
    #   - ./best_ips.txt:/app/best_ips.txt
    #   - ./full_ips.txt:/app/full_ips.txt
